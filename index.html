<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('artCanvas'), ctx = canvas.getContext('2d', { willReadFrequently: true }), stage = $('stage');
  const MAX_DIMENSION = 256, STORE_KEY = 'crisp-pixel-gallery-v2', AUTO_KEY = 'crisp-pixel-autosave-v1';
  let frames = [], currentFrame = 0, tool = 'pencil', drawing = false, selection = null, selectionStart = null, undoStack = [], redoStack = [], animationTimer = null, toastTimer = null, saveTimer = null;

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  function notify(message) {
    const toast = $('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }
  function activeFrame() { return frames[currentFrame]; }
  function cloneCanvas(source) {
    const copy = document.createElement('canvas');
    copy.width = source.width;
    copy.height = source.height;
    copy.getContext('2d').drawImage(source, 0, 0);
    return copy;
  }
  function scheduleAutosave() {
    clearTimeout(saveTimer);
    $('saveStatus').textContent = 'Saving…';
    saveTimer = setTimeout(() => {
      try {
        if (frames.length) {
          localStorage.setItem(AUTO_KEY, JSON.stringify(projectData()));
          $('saveStatus').textContent = 'Saved locally';
        } else {
          $('saveStatus').textContent = 'Ready';
        }
      } catch {
        $('saveStatus').textContent = 'Local storage full';
      }
    }, 500);
  }
  function setCanvasSize(width, height) {
    width = clamp(Math.round(width) || 32, 1, MAX_DIMENSION);
    height = clamp(Math.round(height) || 32, 1, MAX_DIMENSION);
    canvas.width = width;
    canvas.height = height;
    const zoom = Number($('zoomInput').value) || 12;
    canvas.style.width = `${width * zoom}px`;
    canvas.style.height = `${height * zoom}px`;
    $('widthInput').value = width;
    $('heightInput').value = height;
    $('zoomValue').textContent = `${zoom}×`;
    $('zoomLabel').textContent = `Zoom: ${zoom}×`;
    updateStatus();
  }
  function setFrames(newFrames, index = 0) {
    frames = newFrames;
    currentFrame = clamp(index, 0, Math.max(0, frames.length - 1));
    undoStack = [];
    redoStack = [];
    selection = null;
    if (frames.length) {
      setCanvasSize(activeFrame().width, activeFrame().height);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(activeFrame(), 0, 0);
    } else {
      canvas.width = canvas.height = 1;
      stage.classList.add('empty');
    }
    renderFrames();
    updateHistoryButtons();
    updateStatus();
    scheduleAutosave();
  }
  function newCanvas(width, height, color = 'transparent') {
    width = clamp(parseInt(width, 10) || 32, 1, MAX_DIMENSION);
    height = clamp(parseInt(height, 10) || 32, 1, MAX_DIMENSION);
    const frame = document.createElement('canvas');
    frame.width = width;
    frame.height = height;
    if (color !== 'transparent') {
      const fctx = frame.getContext('2d');
      fctx.fillStyle = color;
      fctx.fillRect(0, 0, width, height);
    }
    setFrames([frame]);
    notify('New transparent canvas ready');
  }
  function saveVisibleToFrame() {
    if (!frames.length) return;
    const frame = activeFrame();
    if (frame.width !== canvas.width || frame.height !== canvas.height) {
      frame.width = canvas.width;
      frame.height = canvas.height;
    }
    frame.getContext('2d').clearRect(0, 0, frame.width, frame.height);
    frame.getContext('2d').drawImage(canvas, 0, 0);
  }
  function snapshot() {
    if (!frames.length) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > 40) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function restoreHistory(from, to) {
    if (!from.length || !frames.length) return;
    to.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(from.pop(), 0, 0);
    saveVisibleToFrame();
    updateHistoryButtons();
    renderFrames();
    scheduleAutosave();
  }
  function updateHistoryButtons() {
    $('undoButton').disabled = !undoStack.length;
    $('redoButton').disabled = !redoStack.length;
  }
  function updateStatus() {
    if (frames.length) {
      $('dimensionsLabel').textContent = `${canvas.width} × ${canvas.height} px · frame ${currentFrame + 1}/${frames.length}`;
      stage.classList.remove('empty');
    } else {
      $('dimensionsLabel').textContent = 'No canvas';
      stage.classList.add('empty');
    }
  }
  function render() {
    if (!frames.length) return;
    setCanvasSize(canvas.width, canvas.height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(activeFrame(), 0, 0);
    if (selection) {
      const x = Math.min(selection.x, selection.x + selection.w);
      const y = Math.min(selection.y, selection.y + selection.h);
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1;
      ctx.setLineDash([1, 1]);
      ctx.strokeRect(x + 0.5, y + 0.5, Math.abs(selection.w), Math.abs(selection.h));
      ctx.restore();
    }
    updateStatus();
  }
  function renderFrames() {
    const list = $('framesList');
    list.replaceChildren();
    frames.forEach((frame, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'small' + (index === currentFrame ? ' active' : '');
      button.textContent = `Frame ${index + 1}`;
      button.setAttribute('aria-pressed', String(index === currentFrame));
      button.addEventListener('click', () => switchFrame(index));
      list.append(button);
    });
    $('spriteSheetButton').disabled = frames.length < 2;
  }
  function switchFrame(index) {
    if (!frames.length) return;
    saveVisibleToFrame();
    currentFrame = index;
    selection = null;
    setCanvasSize(activeFrame().width, activeFrame().height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(activeFrame(), 0, 0);
    renderFrames();
    updateStatus();
  }
  function pointFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: clamp(Math.floor((event.clientX - rect.left) * canvas.width / rect.width), 0, canvas.width - 1),
      y: clamp(Math.floor((event.clientY - rect.top) * canvas.height / rect.height), 0, canvas.height - 1)
    };
  }
  function paint(point) {
    if (!frames.length) return;
    const size = clamp(parseInt($('brushSize').value, 10) || 1, 1, 32);
    if (tool === 'picker') {
      const pixel = ctx.getImageData(point.x, point.y, 1, 1).data;
      if (pixel[3]) $('colorInput').value = '#' + [...pixel].slice(0, 3).map(v => v.toString(16).padStart(2, '0')).join('');
      return;
    }
    if (tool === 'fill') {
      floodFill(point.x, point.y, $('colorInput').value);
      return;
    }
    if (tool === 'eraser') {
      ctx.clearRect(point.x - Math.floor(size / 2), point.y - Math.floor(size / 2), size, size);
    } else {
      ctx.fillStyle = $('colorInput').value;
      ctx.fillRect(point.x - Math.floor(size / 2), point.y - Math.floor(size / 2), size, size);
    }
    saveVisibleToFrame();
    renderFrames();
    scheduleAutosave();
  }
  function floodFill(x, y, hex) {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height), data = image.data, w = canvas.width, h = canvas.height;
    const start = (y * w + x) * 4;
    const target = [data[start], data[start + 1], data[start + 2], data[start + 3]];
    const fill = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16), 255];
    if (target.every((v, i) => v === fill[i])) return;
    const stack = [[x, y]];
    while (stack.length) {
      const [px, py] = stack.pop();
      if (px < 0 || py < 0 || px >= w || py >= h) continue;
      const i = (py * w + px) * 4;
      if (data[i] !== target[0] || data[i + 1] !== target[1] || data[i + 2] !== target[2] || data[i + 3] !== target[3]) continue;
      data.set(fill, i);
      stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
    }
    ctx.putImageData(image, 0, 0);
    saveVisibleToFrame();
    renderFrames();
    scheduleAutosave();
  }
  function pointerDown(event) {
    if (!frames.length) return;
    canvas.setPointerCapture(event.pointerId);
    const point = pointFromEvent(event);
    if (event.shiftKey) {
      drawing = true;
      selectionStart = point;
      selection = { x: point.x, y: point.y, w: 1, h: 1 };
      render();
      return;
    }
    if (tool === 'fill' || tool === 'picker') {
      snapshot();
      paint(point);
      return;
    }
    drawing = true;
    snapshot();
    paint(point);
  }
  function pointerMove(event) {
    if (!drawing) return;
    const point = pointFromEvent(event);
    if (selectionStart) {
      selection = { x: selectionStart.x, y: selectionStart.y, w: point.x - selectionStart.x + 1, h: point.y - selectionStart.y + 1 };
      render();
    } else if (tool === 'pencil' || tool === 'eraser') {
      paint(point);
    }
  }
  function pointerUp() {
    drawing = false;
    selectionStart = null;
    saveVisibleToFrame();
    renderFrames();
    scheduleAutosave();
  }
  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  function selectedBounds() {
    if (!selection) return null;
    const x = clamp(Math.min(selection.x, selection.x + selection.w), 0, canvas.width - 1);
    const y = clamp(Math.min(selection.y, selection.y + selection.h), 0, canvas.height - 1);
    const right = clamp(Math.max(selection.x, selection.x + selection.w), x + 1, canvas.width);
    const bottom = clamp(Math.max(selection.y, selection.y + selection.h), y + 1, canvas.height);
    return { x, y, w: right - x, h: bottom - y };
  }
  function transformSelection(action) {
    if (!frames.length) return notify('Create or open a canvas first');
    const bounds = selectedBounds();
    if (!bounds) return notify('Hold Shift and drag on the canvas to select an area');
    snapshot();
    const changed = frames.map(old => {
      const next = document.createElement('canvas');
      if (action === 'crop') {
        next.width = bounds.w;
        next.height = bounds.h;
        next.getContext('2d').drawImage(old, bounds.x, bounds.y, bounds.w, bounds.h, 0, 0, bounds.w, bounds.h);
      } else {
        next.width = old.width;
        next.height = old.height;
        next.getContext('2d').drawImage(old, 0, 0);
        next.getContext('2d').clearRect(bounds.x, bounds.y, bounds.w, bounds.h);
      }
      return next;
    });
    setFrames(changed, currentFrame);
    notify(action === 'crop' ? 'Cropped animation frames' : 'Cleared selected area');
  }
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
  }
  function exportCurrent() {
    if (!frames.length) return notify('Create or open a canvas first');
    saveVisibleToFrame();
    const scale = Number($('scaleSelect').value) || 1, out = document.createElement('canvas');
    out.width = canvas.width * scale;
    out.height = canvas.height * scale;
    const outCtx = out.getContext('2d');
    outCtx.imageSmoothingEnabled = false;
    outCtx.drawImage(canvas, 0, 0, out.width, out.height);
    const mime = $('formatSelect').value;
    out.toBlob(blob => {
      if (!blob) return notify('This image format is not supported by the browser');
      downloadBlob(blob, `pixel-sprite-${canvas.width}x${canvas.height}-${scale}x.${mime === 'image/jpeg' ? 'jpg' : mime === 'image/webp' ? 'webp' : 'png'}`);
      notify(`Exported ${out.width} × ${out.height} sprite`);
    }, mime, mime === 'image/jpeg' || mime === 'image/webp' ? 0.92 : undefined);
  }
  function spriteSheet() {
    if (frames.length < 2) return notify('Add at least two frames first');
    const sheet = document.createElement('canvas');
    sheet.width = canvas.width * frames.length;
    sheet.height = canvas.height;
    const sctx = sheet.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    frames.forEach((frame, index) => sctx.drawImage(frame, index * canvas.width, 0));
    sheet.toBlob(blob => blob && downloadBlob(blob, `pixel-spritesheet-${canvas.width}x${canvas.height}-${frames.length}-frames.png`), 'image/png');
    notify('Sprite sheet exported horizontally');
  }
  function projectData() {
    saveVisibleToFrame();
    return {
      app: 'Crisp Pixel Studio',
      version: 2,
      width: canvas.width,
      height: canvas.height,
      currentFrame,
      fps: clamp(parseInt($('fpsInput').value, 10) || 6, 1, 24),
      frames: frames.map(frame => frame.toDataURL('image/png'))
    };
  }
  function saveProjectFile() {
    if (!frames.length) return notify('Nothing to save');
    downloadBlob(new Blob([JSON.stringify(projectData())], { type: 'application/json' }), 'crisp-pixel-project.json');
    notify('Portable project file downloaded');
  }
  function loadProjectObject(project) {
    if (!project || !Array.isArray(project.frames) || !project.frames.length || project.frames.length > 100) throw new Error('Invalid project');
    Promise.all(project.frames.map(src => new Promise((resolve, reject) => {
      if (typeof src !== 'string' || src.length > 3_000_000) return reject(new Error('Invalid frame'));
      const image = new Image();
      image.onload = () => {
        if (image.naturalWidth > MAX_DIMENSION || image.naturalHeight > MAX_DIMENSION) return reject(new Error('Canvas too large'));
        const frame = document.createElement('canvas');
        frame.width = image.naturalWidth;
        frame.height = image.naturalHeight;
        frame.getContext('2d').drawImage(image, 0, 0);
        resolve(frame);
      };
      image.onerror = reject;
      image.src = src;
    }))).then(loaded => {
      if (loaded.some(frame => frame.width !== loaded[0].width || frame.height !== loaded[0].height)) throw new Error('Frame size mismatch');
      $('fpsInput').value = clamp(Number(project.fps) || 6, 1, 24);
      setFrames(loaded, clamp(Number(project.currentFrame) || 0, 0, loaded.length - 1));
      notify('Project opened');
    }).catch(() => notify('Could not read this project file'));
  }
  function loadFile(file) {
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { notify('Please use a file smaller than 15 MB'); return; }
    if (file.name.toLowerCase().endsWith('.json')) {
      const reader = new FileReader();
      reader.onload = () => {
        try { loadProjectObject(JSON.parse(reader.result)); } catch { notify('Invalid project file'); }
      };
      reader.readAsText(file);
      return;
    }
    if (!file.type.startsWith('image/')) return notify('Choose an image or Pixel Studio project file');
    const url = URL.createObjectURL(file), image = new Image();
    image.onload = () => {
      const width = clamp(parseInt($('widthInput').value, 10) || image.naturalWidth, 1, MAX_DIMENSION);
      const height = clamp(parseInt($('heightInput').value, 10) || image.naturalHeight, 1, MAX_DIMENSION);
      const frame = document.createElement('canvas');
      frame.width = width;
      frame.height = height;
      const fctx = frame.getContext('2d');
      fctx.imageSmoothingEnabled = false;
      fctx.drawImage(image, 0, 0, width, height);
      setFrames([frame]);
      URL.revokeObjectURL(url);
      notify('Image imported; scaled with crisp pixels');
    };
    image.onerror = () => { URL.revokeObjectURL(url); notify('Could not open that image'); };
    image.src = url;
  }
  function getGallery() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { return []; }
  }
  function renderGallery() {
    const query = $('searchInput').value.trim().toLowerCase(), list = $('galleryList');
    list.replaceChildren();
    getGallery().filter(item => item.name.toLowerCase().includes(query)).forEach(item => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'gallery-item';
      const image = document.createElement('img');
      image.src = item.preview;
      image.alt = '';
      const title = document.createElement('span');
      title.textContent = item.name;
      button.append(image, title);
      button.addEventListener('click', () => loadProjectObject(item.project));
      list.append(button);
    });
    if (!list.children.length) {
      const empty = document.createElement('p');
      empty.className = 'hint';
      empty.textContent = query ? 'No matching projects.' : 'No saved projects yet.';
      list.append(empty);
    }
  }
  function saveToGallery() {
    if (!frames.length) return notify('Nothing to save');
    const name = prompt('Name this game asset/project:', 'My pixel sprite');
    if (!name?.trim()) return;
    try {
      const gallery = getGallery();
      gallery.unshift({ name: name.trim(), preview: canvas.toDataURL('image/png'), project: projectData() });
      localStorage.setItem(STORE_KEY, JSON.stringify(gallery.slice(0, 20)));
      renderGallery();
      notify('Saved in this browser');
    } catch {
      notify('Browser storage is full; download the project file instead');
    }
  }
  function play() {
    if (frames.length < 2) return notify('Add at least two frames for animation preview');
    if (animationTimer) {
      clearInterval(animationTimer);
      animationTimer = null;
      $('playButton').textContent = '▶ Play';
      switchFrame(currentFrame);
      return;
    }
    $('playButton').textContent = '■ Stop';
    animationTimer = setInterval(() => switchFrame((currentFrame + 1) % frames.length), 1000 / clamp(parseInt($('fpsInput').value, 10) || 6, 1, 24));
  }

  document.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => {
    tool = button.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(item => item.classList.toggle('active', item === button));
    $('cursorLabel').textContent = `Tool: ${tool[0].toUpperCase() + tool.slice(1)}`;
  }));
  $('newButton').addEventListener('click', () => newCanvas($('widthInput').value, $('heightInput').value));
  $('importButton').addEventListener('click', () => $('fileInput').click());
  $('openButton').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', event => { loadFile(event.target.files[0]); event.target.value = ''; });
  $('undoButton').addEventListener('click', () => restoreHistory(undoStack, redoStack));
  $('redoButton').addEventListener('click', () => restoreHistory(redoStack, undoStack));
  $('exportButton').addEventListener('click', exportCurrent);
  $('downloadButton').addEventListener('click', exportCurrent);
  $('spriteSheetButton').addEventListener('click', spriteSheet);
  $('saveProjectButton').addEventListener('click', saveProjectFile);
  $('saveGalleryButton').addEventListener('click', saveToGallery);
  $('searchInput').addEventListener('input', renderGallery);
  $('playButton').addEventListener('click', play);
  $('addFrameButton').addEventListener('click', () => {
    if (!frames.length) return notify('Create a canvas first');
    saveVisibleToFrame();
    const frame = document.createElement('canvas');
    frame.width = canvas.width;
    frame.height = canvas.height;
    frames.splice(currentFrame + 1, 0, frame);
    switchFrame(currentFrame + 1);
    scheduleAutosave();
  });
  $('duplicateFrameButton').addEventListener('click', () => {
    if (!frames.length) return notify('Create a canvas first');
    saveVisibleToFrame();
    frames.splice(currentFrame + 1, 0, cloneCanvas(activeFrame()));
    switchFrame(currentFrame + 1);
    scheduleAutosave();
  });
